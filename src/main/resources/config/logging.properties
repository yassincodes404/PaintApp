# Paint Studio logging defaults. User overrides: %LOCALAPPDATA%/PaintStudio/config/logging.properties
logging.enabled=true
logging.level=INFO
logging.console.enabled=true
logging.file.enabled=true
logging.file.format=jsonl
logging.file.max-size-mb=10
logging.file.max-files=10
logging.file.retention-days=14
logging.queue.capacity=4096
logging.queue.error-reserve=128
logging.flush.interval-ms=1000
logging.shutdown.timeout-ms=3000
logging.startup.configuration=true
logging.startup.environment=true
logging.input.shortcuts=true
logging.input.key-events=false
logging.input.typed-text=false
logging.input.mouse-movement=false
logging.context.full-paths=false
logging.context.stack-traces=true
logging.category.startup=true
logging.category.configuration=true
logging.category.resource=true
logging.category.document=true
logging.category.action=true
logging.category.input=false
logging.category.performance=false
logging.category.system=true
