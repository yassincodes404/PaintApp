# User defaults; overrides are persisted in config/settings.json.
# Default theme and the splash master switch remain in app.properties.
canvas.grid=false
canvas.width=4096
canvas.height=4096
canvas.background=#201F1E
canvas.auto-expand=true
canvas.expansion.step=512
canvas.expansion.margin=128
canvas.zoom.min=0.05
canvas.zoom.max=16
history.memory.mib=128
history.commands=1000
# 0 disables autosave and its timer.
recovery.interval.seconds=120
recovery.generations=3
recovery.max.mib=128
# Resource policies; restart required.
io.queue.capacity=8
io.shutdown.seconds=10
document.max.objects=100000
document.max.points=2000000
stroke.max.points=20000
project.max.mib=128
export.max.pixels=16777216
document.coordinate.limit=1000000
input.spacing=0.75
